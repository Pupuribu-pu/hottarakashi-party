<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ほったらかしパーティ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9eef2;--ink:#1c2541;--card:#fff;--mint:#3fb68b;--sun:#f6c445;--berry:#d6456b;--mut:#5b6785;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2140;--ink:#f1f4ff;--card:#2a3160;--mut:#a9b3d8}}
:root[data-theme="dark"]{--bg:#1b2140;--ink:#f1f4ff;--card:#2a3160;--mut:#a9b3d8}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'M PLUS Rounded 1c',system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.top b{font-size:1.5rem}
#field{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:20px;padding:14px 10px;margin:10px 0;border:3px solid var(--ink)}
.side{display:flex;flex-direction:column;gap:6px;width:46%}
.u{display:flex;align-items:center;gap:6px;font-size:1.7rem}
.u.dead{opacity:.3}
.bar{flex:1;height:8px;background:rgba(128,128,128,.25);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint)}
.en .bar i{background:var(--berry)}
.vs{font-weight:800;color:var(--mut)}
.en{align-items:flex-end}.en .u{font-size:3rem}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:8px 10px;margin-bottom:6px}
.row .e{font-size:1.8rem}.row .t{flex:1;font-size:.85rem}.row small{color:var(--mut)}
button{font:inherit;font-weight:800;border:3px solid var(--ink);background:var(--sun);color:#1c2541;border-radius:12px;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
#sm{width:100%;margin:8px 0;background:var(--mint);font-size:1.05rem;padding:12px}
#field{display:block}
#slots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
#slots .sl{grid-column:span 2}#slots .sl:nth-child(5){grid-column:2/span 2}
.sl{position:relative;background:transparent;border:2px dashed var(--mut);color:var(--ink);padding:18px 2px 8px;border-radius:12px;font-size:1.7rem;font-weight:500;min-height:84px}
.sl .n{position:absolute;top:2px;left:6px;font-size:.7rem;color:var(--mut)}
.sl .bar{margin-top:4px}
.sl.dead{opacity:.3}
.enb{text-align:center;margin-top:16px;font-size:3.2rem}
.enb .bar{height:12px;margin:4px auto;max-width:70%}
.enb .bar i{background:var(--berry)}
#et{font-weight:800;font-size:.9rem}
.hint{font-size:.8rem;color:var(--mut);margin:6px 0 0}
.tr h3{margin:14px 0 6px}.row button.pr{background:var(--berry);color:#fff}
</style></head>
<body><main>
<div class="top"><span>ステージ <b id="st"></b></span><span>🪙 <b id="gd"></b> <small id="gp"></small>💠<b id="sr"></b></span></div>
<p class="hint">番号の枠をタップすると、キャラを配置できます。敵をタップすると、単体攻撃でその敵を狙います</p>
<div style="display:flex;gap:8px;margin-top:8px"><button id="bk" onclick="back()" style="flex:1"></button><button id="sp" onclick="spd=spd==1?2:1;S.spd=spd;save();draw()" style="flex:1"></button></div>
<div id="field"><div id="slots"></div><div class="enb"><div id="ee"></div><div class="bar"><i id="eb"></i></div><div id="et"></div></div></div>
<div id="bag"></div><p class="hint" id="ob" style="margin:8px 0 0"></p><button id="sm" onclick="summon()"></button><p class="hint" id="gm">排出率: ★1 56.95% / ★2 30% / ★3 10% / ★4 3% / ？？？ 0.05%</p>
<p class="hint">⚔️剣 → 🔮魔法 → 🛡️盾 → ⚔️剣 の順で有利(ダメージ1.5倍)、逆は0.5倍(半減)。📜お札は味方を回復するキャラ(相性なし)</p>
<div id="list"></div><div class="tr"><h3>🌳 強化ツリー</h3><div id="tree"></div><div id="pr" hidden></div><h3>🔁 転生</h3><div id="rb2"></div><h3>📖 図鑑</h3><div id="zk"></div></div>
</main>
<script>
const H=[
{n:'ハムの戦士',e:'🐹',hp:70,a:9,s:1},
{n:'キツネの弓',e:'🦊',hp:45,a:12,s:1.4},
{n:'カメの盾',e:'🐢',hp:140,a:5,s:.9},
{n:'タコの魔術',e:'🐙',hp:40,a:18,s:.7},
{n:'ウサギの拳',e:'🐰',hp:60,a:10,s:1},
{n:'ネコの御札',e:'🐱',hp:50,a:8,s:.8,heal:1},
{n:'フクロウの祈祷',e:'🦉',hp:45,a:6,s:.6,heal:1,all:1},
{n:'イヌの剣士',e:'🐶',hp:80,a:9,s:1.1,t:'剣',r:1},
{n:'ニワトリの槍',e:'🐔',hp:60,a:11,s:1,t:'剣',r:1},
{n:'ブタの盾兵',e:'🐷',hp:120,a:6,s:1,t:'盾',r:1},
{n:'サルの術師',e:'🐵',hp:45,a:12,s:.9,t:'魔法',r:1},
{n:'ネズミの護符',e:'🐭',hp:50,a:7,s:.9,t:'お札',r:1,heal:1},
{n:'カエルの盾',e:'🐸',hp:110,a:7,s:1.1,t:'盾',r:1},
{n:'ヒツジの祈り',e:'🐑',hp:55,a:5,s:.7,t:'お札',r:1,heal:1,all:1},
{n:'ライオンの剣',e:'🦁',hp:90,a:15,s:1,t:'剣',r:2},
{n:'ペンギンの盾',e:'🐧',hp:170,a:8,s:1,t:'盾',r:2},
{n:'コウモリの魔道',e:'🦇',hp:50,a:17,s:.9,t:'魔法',r:2},
{n:'パンダの守り',e:'🐼',hp:150,a:10,s:.9,t:'盾',r:2},
{n:'シカの御札',e:'🦌',hp:70,a:10,s:.8,t:'お札',r:2,heal:1},
{n:'クマの剣',e:'🐻',hp:120,a:14,s:.9,t:'剣',r:2},
{n:'インコの祝詞',e:'🦜',hp:60,a:8,s:.7,t:'お札',r:2,heal:1,all:1},
{n:'ドラゴンの剣',e:'🐉',hp:110,a:24,s:.9,t:'剣',r:3},
{n:'ユニコーンの癒し',e:'🦄',hp:70,a:12,s:.9,t:'お札',r:3,heal:1},
{n:'ヘビの魔術',e:'🐍',hp:55,a:26,s:.8,t:'魔法',r:3},
{n:'ゾウの大盾',e:'🐘',hp:260,a:12,s:.8,t:'盾',r:3},
{n:'トラの豪剣',e:'🐯',hp:130,a:32,s:.9,t:'剣',r:4},
{n:'オオカミの旋風',e:'🐺',hp:120,a:17,s:.9,t:'剣',r:4,aoe:1},
{n:'キリンの極光',e:'🦒',hp:80,a:38,s:.8,t:'魔法',r:4},
{n:'カミナリの閃光',e:'⚡',hp:90,a:20,s:.8,t:'魔法',r:4,aoe:1},
{n:'サイの突進',e:'🦏',hp:300,a:15,s:.8,t:'盾',r:4,aoe:1},
{n:'ハクチョウの聖歌',e:'🦢',hp:90,a:16,s:.9,t:'お札',r:4,heal:1},
{n:'クジャクの福音',e:'🦚',hp:95,a:13,s:.8,t:'お札',r:4,heal:1,all:1},
{n:'神の一撃',e:'🐳',hp:120,a:25,s:.7,t:'無',r:5,aoe:1,sz:3}];
const E=['👾','🐲','👻','🦂','🧟'];
['剣','剣','盾','魔法','盾','お札','お札'].forEach((t,i)=>H[i].t=t);
[1,2,1,3,1,2,3].forEach((r,i)=>H[i].r=r);const RC={1:'#9aa3b5',2:'#3b82f6',3:'#f6a800',4:'#d6456b',5:'#8a4fff'},RM={1:1,2:1.25,3:1.5,4:2,5:2.5},CM={1:1,2:2,3:4,4:10,5:20},cost=(i,l)=>Math.ceil(15*CM[H[i].r]*Math.pow(1.45,l-1)),st=n=>n==5?'？？？':'★'.repeat(n),rs=i=>`<span style="color:${RC[H[i].r]}">${st(H[i].r)}</span>`;
const IC={剣:'⚔️',盾:'🛡️',魔法:'🔮',お札:'📜',無:'⚪'},BT={剣:'魔法',魔法:'盾',盾:'剣'},mult=(a,d)=>BT[a]==d?1.5:BT[d]==a?.5:1;
let S=null;
try{S=JSON.parse(localStorage.getItem('pp'))}catch(e){}
S=S||{stage:1,gold:0,own:{0:1},t:Date.now(),sm:0};S.tr=S.tr||{i:0,a:0,h:0,g:0};S.tr.o=S.tr.o||0;S.dup=S.dup||{};S.ru=S.ru||{a:0,h:0,g:0};S.rp=S.rp||0;S.orb=S.orb||0;S.seen=S.seen||{};Object.keys(S.own).forEach(k=>S.seen[k]=1);S.star=S.star||0;
const rew=n=>6*Math.pow(1.22,n);
const sb=()=>1+.1*S.ru.g,gm=()=>(1+.15*S.tr.g)*sb(),gps=()=>(.3+.4*S.tr.i)*(1+.15*S.stage)*gm();
const orate=()=>.1+.05*S.tr.o;
const dp=i=>Math.pow(1.05,S.dup[i]||0);
const mhp=i=>H[i].hp*RM[H[i].r]*dp(i)*(1+.3*(S.own[i]-1))*(1+.1*S.tr.h)*(1+.05*S.ru.h);
const atk=i=>H[i].a*RM[H[i].r]*dp(i)*(1+.3*(S.own[i]-1))*(1+.1*S.tr.a)*(1+.05*S.ru.a);
let P=[],en,EN=[],bk=0,tg=null,spd=S.spd||1;const stash={};
function save(){S.t=Date.now();try{localStorage.setItem('pp',JSON.stringify(S))}catch(e){}}
function spawn(){const n=S.stage,b=n%5==0,m=40*Math.pow(1.24,n)*(b?2:1);
en={hp:m,max:m,cd:1,life:45,t:['剣','盾','魔法'][Math.floor(Math.random()*3)],e:b?'👹':E[n%5],a:4*Math.pow(1.17,n)*(b?1.2:1)}}
if(!S.slots){S.slots=[null,null,null,null,null];Object.keys(S.own).slice(0,5).forEach((k,j)=>S.slots[j]=+k)}while(S.slots.length<7)S.slots.push(null);S.ul=S.ul||0;
function party(){const o=P.slice();P=[];S.slots.forEach((i,s)=>{if(i!=null&&i>=0){const q=o.find(x=>x.i==i);P.push({i,s,hp:q?q.hp:(stash[i]!=null?stash[i]:mhp(i)),cd:q?q.cd:0,dd:q?q.dd:0})}});o.forEach(q=>{if(!P.some(p=>p.i==q.i))stash[q.i]=q.hp})}
function slots(){document.getElementById('slots').innerHTML=S.slots.map((i,s)=>s>=5+S.ul?`<button class="sl" onclick="unl(${s})"><span class="n">${s+1}</span>🔒<br><small>💠${s==5?100:200}</small></button>`:i==-1?`<button class="sl" disabled><span class="n">${s+1}</span>🔗</button>`:`<button class="sl" onclick="place(${s})"><span class="n">${s+1}</span>${i==null?'＋':`<span>${H[i].e}</span><small>${IC[H[i].t]}</small><div class="bar"><i id="b${s}"></i></div>`}</button>`).join('');draw()}
function place(s){const used=S.slots.filter((x,k)=>k!=s&&x!=null);const opts=Object.keys(S.own).map(Number).filter(i=>!used.includes(i));const cur=S.slots[s];const k=cur==null?0:opts.indexOf(cur)+1;S.slots[s]=k<opts.length?opts[k]:null;party();slots();save()}
function tick(){
const dt=.1*spd,al=P.filter(p=>p.hp>0);S.gold+=gps()*.1;S.orb+=orate()*.1;bk=Math.max(0,bk-.1);
al.forEach(p=>{p.cd-=dt;if(p.cd<=0){p.cd=1/H[p.i].s;
if(H[p.i].heal){if(H[p.i].all)al.forEach(w=>w.hp=Math.min(mhp(w.i),w.hp+atk(p.i)));else{const w=al.filter(x=>x.hp<mhp(x.i)).sort((a,b)=>a.s-b.s)[0];if(w)w.hp=Math.min(mhp(w.i),w.hp+atk(p.i)*3)}}
else{const dm=atk(p.i);if(H[p.i].aoe){const lv=EN.filter(q=>q.hp>0);if(H[p.i].r==5&&lv.length==1)lv[0].hp-=dm*1.4*mult(H[p.i].t,lv[0].t);else EN.forEach(q=>q.hp-=dm*mult(H[p.i].t,q.t))}else{const T=tg&&tg.hp>0&&EN.includes(tg)?tg:en;T.hp-=dm*mult(H[p.i].t,T.t)}}}});
en.cd-=dt;en.life-=dt;
P.forEach(p=>{if(p.hp<=0){p.dd=(p.dd||0)+dt;if(p.dd>=15){p.hp=mhp(p.i)*.3;p.dd=0}}else p.dd=0});
if(P.some(p=>!H[p.i].heal)&&!P.some(p=>p.hp>0&&!H[p.i].heal))P.forEach(p=>{if(H[p.i].heal)p.hp=Math.min(p.hp,0)});
EN.forEach(q=>{if(q!==en)q.cd-=dt;if(q.hp>0&&q.cd<=0&&al.length){q.cd=1;if(q.b&&Math.random()<.5)al.forEach(w=>w.hp-=q.a*.35*mult(q.t,H[w.i].t));else{const w=al[Math.floor(Math.random()*al.length)];w.hp-=q.a*mult(q.t,H[w.i].t)}}});
const lf0=en.life;EN=EN.filter(q=>q.hp>0);if(EN.length){en=EN[0];en.life=lf0}
if(en.life<=0){S.stage=(s=>{const b=Math.floor((s-1)/5)*5+1;return s==b?Math.max(1,s-3):b})(S.stage);P.forEach(p=>p.hp=mhp(p.i));spawn()}else if(!EN.length){S.gold+=rew(S.stage)*gm();S.stage++;spawn();P.forEach(p=>p.hp=Math.min(mhp(p.i),p.hp+mhp(p.i)*.3))}
else if(P.length&&!P.some(p=>p.hp>0)){S.stage=(s=>{const b=Math.floor((s-1)/5)*5+1;return s==b?Math.max(1,s-3):b})(S.stage);P.forEach(p=>p.hp=mhp(p.i));spawn()}
draw()}
const pc=(a,b)=>Math.max(0,a/b*100).toFixed(0)+'%';
function draw(){
document.getElementById('st').textContent=S.stage;
document.getElementById('gd').textContent=Math.floor(S.gold);document.getElementById('gp').textContent='(+'+gps().toFixed(1)+'/秒)';document.getElementById('sr').textContent=S.rp;document.getElementById('ob').textContent='🟣オーブ '+Math.floor(S.orb)+'（+'+orate().toFixed(2)+'/秒）';
const $=x=>document.getElementById(x);
$('bk').textContent=bk>0?'◀ 戻る('+Math.ceil(bk)+'秒)':'◀ 1つ戻る';$('bk').disabled=bk>0||S.stage<=1;$('sp').textContent=spd>1?'⏩ 2倍速 ON':'▶ 1倍速';$('sp').style.background=spd>1?'var(--mint)':'';
P.forEach(p=>{const el=$('b'+p.s);if(el){el.style.width=pc(p.hp,mhp(p.i));el.parentNode.parentNode.classList.toggle('dead',p.hp<=0)}});
$('ee').innerHTML=EN.map((q,k)=>`<span onpointerdown='tgt(${k})' style='cursor:pointer;display:inline-block;margin:0 4px;padding:2px 6px;border-radius:12px;border:3px solid ${(tg&&EN.includes(tg)?tg:en)===q&&EN.length>1?'var(--berry)':'transparent'};font-size:${EN.length>1?'2.2rem':'3.2rem'}'>${q.b?'<small style="display:block;font-size:.75rem;color:var(--berry);font-weight:800">👑BOSS</small>':''}${q.e}<small style='display:block;font-size:.7rem'>${IC[q.t]} ${Math.max(0,Math.ceil(q.hp))}</small></span>`).join('');$('eb').style.width=pc(en.hp,en.max);$('et').textContent=(en.b?'👑BOSS 全体・単体攻撃! ':'')+IC[en.t]+en.t+'属性  HP '+Math.max(0,Math.ceil(en.hp))+' / '+Math.ceil(en.max)+'  🏃'+Math.ceil(en.life)+'秒で逃げる'}
let n=0;
function list(){tree();bag();zk();rbui();
const c=50*Math.pow(1.5,S.sm),sm=document.getElementById('sm');
sm.textContent='🎁 なかまを呼ぶ  🟣10';sm.disabled=S.orb<10;
const rowf=i=>{const l=S.own[i],u=cost(i,l);
return `<div class="row"><span class="e">${H[i].e}</span><div class="t"><b>${H[i].n}</b> ${rs(i)} ${IC[H[i].t]} Lv${l}<br><small>${H[i].heal?(H[i].all?'全体回復':'単体回復'):(H[i].aoe?'全体攻撃':'単体攻撃')} ${Math.round(atk(i))} / HP ${Math.round(mhp(i))}${H[i].r==5?'<br>🔗編成枠を3つ使う / ✨敵が1体になると、1.4倍の単体攻撃に変化':''}</small></div><button ${S.gold<u?'disabled':''} onclick="up(${i})">強化 🪙${u}</button></div>`};
const ks=Object.keys(S.own),ins=ks.filter(i=>S.slots.includes(+i)),outs=ks.filter(i=>!S.slots.includes(+i));
document.getElementById('list').innerHTML='<h3 style="margin:10px 0 6px">⚔️ 編成中</h3>'+(ins.map(rowf).join('')||'<p class="hint">いません</p>')+'<h3 style="margin:10px 0 6px">🎒 未編成</h3>'+(outs.map(rowf).join('')||'<p class="hint">いません</p>')}
function up(i){const u=cost(i,S.own[i]);if(S.gold<u)return;S.gold-=u;const o=mhp(i);S.own[i]++;const p=P.find(p=>p.i==i);if(p&&p.hp>0)p.hp+=mhp(i)-o;list();save()}
function summon(){if(S.orb<10)return;S.orb-=10;S.sm++;
const x=Math.random()*100,rr=x<.05?5:x<3.05?4:x<13.05?3:x<43.05?2:1,pl=H.map((h,k)=>k).filter(k=>H[k].r==rr),i=pl[Math.floor(Math.random()*pl.length)];document.getElementById('gm').textContent='🎁 '+st(H[i].r)+' '+H[i].e+H[i].n+(S.own[i]?'（ダブり→Lv UP & 基礎ステ×1.05）':'（NEW!）');
if(S.own[i]){const o=mhp(i);S.own[i]++;S.dup[i]=(S.dup[i]||0)+1;const p=P.find(p=>p.i==i);if(p&&p.hp>0)p.hp+=mhp(i)-o}else{S.own[i]=1;S.seen[i]=1;if(autoEq(i))party();else document.getElementById('gm').textContent+=' ※スロットが満員！バッグから入れ替えてね'}
slots();list();save()}
const TR=[['i','💰','自動収入',40,[]],['a','⚔️','攻撃力',60,[['i',1]]],['h','❤️','体力',60,[['i',1]]],['g','🌾','収穫ボーナス',150,[['a',3],['h',3]]],['o','🟣','オーブ獲得',30,[]]];
const tc=k=>Math.ceil(TR.find(t=>t[0]==k)[3]*Math.pow(1.6,S.tr[k]));
let arm=0,keep=null;const opts=()=>Object.keys(S.own).map(Number).filter(i=>i!=0);function pick(i){keep=i;tree()}
let rsel=[];const RU=[['a','⚔️','全体の攻撃力',5],['h','❤️','全体の体力',5],['g','🌾','ゴールド獲得',10]];
function rbui(){const n=Math.floor(S.stage/50),sel=rsel.filter(i=>S.own[i]),ut=sel.map(i=>H[i].t);
let h=`<div class='row'><span class='e'>🔁</span><div class='t'><b>転生</b> 💠${S.rp}<br><small>${n<1?'ステージ50から転生できます(50ごとに💠10)':'転生すると💠+'+n*10}</small></div><button class='pr' ${n<1?'disabled':''} onclick='rgo()'>${arm?'もう一度タップ!':'転生'}</button></div>`;
h+=`<div class='row'><div class='t'><b>引き継ぐキャラ</b> <small>(${sel.length}/3・属性はバラバラに)</small><br>${Object.keys(S.own).map(Number).map(i=>{const on=sel.includes(i),dis=!on&&(sel.length>=3||ut.includes(H[i].t));return `<button style='margin:4px 4px 0 0;${on?'background:var(--mint)':''}' ${dis?'disabled':''} onclick='rtog(${i})'>${H[i].e}${IC[H[i].t]}</button>`}).join('')}</div></div>`;
h+=`<p class='hint' style='margin:8px 0 4px'>💠 リバポ強化</p>`+RU.map(([k,e,nm,p],x)=>{const c=S.ru[k]+1;return `<div class='row'><span class='e'>${e}</span><div class='t'><b>${nm}</b> Lv${S.ru[k]}<br><small>1Lvごとに+${p}%（今 +${p*S.ru[k]}%）</small></div><button ${S.rp<c?'disabled':''} onclick='rbuy(${x})'>💠${c}</button></div>`}).join('');
document.getElementById('rb2').innerHTML=h}
function rtog(i){const k=rsel.indexOf(i);if(k>=0)rsel.splice(k,1);else if(rsel.length<3&&!rsel.some(j=>H[j].t==H[i].t))rsel.push(i);rbui()}
function rbuy(x){const k=RU[x][0],c=S.ru[k]+1;if(S.rp<c)return;S.rp-=c;S.ru[k]++;list();save()}
function rgo(){const n=Math.floor(S.stage/50);if(n<1)return;if(!arm){arm=1;rbui();setTimeout(()=>{arm=0;rbui()},3000);return}
const lv=rsel.filter(i=>S.own[i]).slice(0,3).map(i=>[i,S.own[i],S.dup[i]||0]);
S.rp+=n*10;S.stage=1;S.gold=0;S.sm=0;S.tr={i:0,a:0,h:0,g:0,o:0};S.own={0:1};S.dup={};
lv.forEach(([i,l,d])=>{S.own[i]=1;if(d)S.dup[i]=d});
S.slots=[null,null,null,null,null,null,null];Object.keys(S.own).map(Number).sort((a,b)=>(H[b].sz||1)-(H[a].sz||1)).forEach(i=>autoEq(i));
rsel=[];arm=0;P=[];for(const z in stash)delete stash[z];party();spawn();slots();list();save()}
function bag(){document.getElementById('bag').innerHTML='<p class="hint" style="margin:8px 0 4px">🎒 バッグ（タップで装備・外す）</p>'+['剣','盾','魔法','お札','無'].map(t=>{const ids=Object.keys(S.own).map(Number).filter(i=>H[i].t==t).sort((a,b)=>(H[a].all||H[a].aoe?0:1)-(H[b].all||H[b].aoe?0:1)||H[b].r-H[a].r||a-b);return ids.length?`<p class="hint" style="margin:6px 0 2px">${IC[t]} ${t}</p>`+ids.map(i=>{const s=S.slots.indexOf(i),on=s>=0;return `<button style="margin:0 4px 4px 0;${on?'background:var(--mint)':''}" onclick="equip(${i})">${H[i].e}${IC[H[i].t]}<small style="display:block;font-size:.65rem">${rs(i)} ${H[i].all||H[i].aoe?'全':'単'}<br>${on?'枠'+(s+1)+' ':''}Lv${S.own[i]}</small></button>`}).join(''):''}).join('')}
function zk(){document.getElementById('zk').innerHTML=H.map((h,i)=>{const o=S.own[i],sn=S.seen[i],sec=h.r==5&&!sn;return `<div class="row" style="${sn?'':'opacity:.55'}"><span class="e">${h.e}</span><div class="t"><b>${h.n}</b> ${rs(i)} ${IC[h.t]}${h.t}${o?' Lv'+o+(S.dup[i]?'（被り×'+S.dup[i]+'）':''):(sn?' 所持なし':' 未入手')}<br><small>${sec?'ステータス ？？？':''}<span ${sec?'hidden':''}>HP ${Math.round(h.hp*RM[h.r]*dp(i))} / ${h.heal?(h.all?'全体回復':'単体回復'):(sn?(h.aoe?'全体攻撃':'単体攻撃'):'攻撃')} ${Math.round(h.a*RM[h.r]*dp(i))} / 速さ ${h.s}回/秒 / 強化 🪙${cost(i,1)}〜</span>${h.r==5&&sn?'<br>🔗編成枠を3つ使う / ✨敵が1体になると、1.4倍の単体攻撃に変化':''}</small></div></div>`}).join('')}
function spawn(){const n=S.stage,b=n%5==0,c=b?1:n<4?1:n<10?2:3,m=40*Math.pow(1.24,n)*(b?2:1)*(c==1?1:c==2?.85:.6),a=4*Math.pow(1.17,n)*(b?1.5:1)*(c==1?1:.6);
EN=[];for(let k=0;k<c;k++)EN.push({hp:m,max:m,cd:1+k*.3,life:45,t:['剣','盾','魔法'][(n+k)%3],e:b?'👹':E[(n+k)%5],a,b});en=EN[0];tg=null}
function tgt(k){const q=EN[k];tg=tg===q?null:q;draw()}
function unl(s){const g=document.getElementById('gm');if(s!=5+S.ul){g.textContent='先にとなりの枚を解除してね';return}const c=s==5?100:200;if(S.rp<c){g.textContent='💠リバポが足りません(必要 '+c+')';return}S.rp-=c;S.ul++;g.textContent='🔓 '+(s+1)+'番目の枠を解除した！';slots();list();save()}
function equip(i){const s=S.slots.indexOf(i);if(s>=0)S.slots[s]=null;else{const e=S.slots.slice(0,5+S.ul).indexOf(null);if(e<0){document.getElementById('gm').textContent='スロットが満員！先に外してね';return}S.slots[e]=i}party();slots();bag();save()}
function back(){if(bk>0||S.stage<=1)return;S.stage--;bk=30;spawn();draw();save()}
function tree(){
document.getElementById('tree').innerHTML=TR.map(([k,e,nm,b,nd])=>{const lock=nd.find(([q,l])=>S.tr[q]<l),c=tc(k);
return `<div class="row"><span class="e">${e}</span><div class="t"><b>${nm}</b> Lv${S.tr[k]}<br><small>${lock?'🔒 '+TR.find(t=>t[0]==lock[0])[2]+' Lv'+lock[1]+'で解放':'次のLvで '+(k=='g'?'+15%':k=='i'?'+0.4/秒':k=='o'?'+0.05/秒':'+10%')}</small></div><button ${lock||S.gold<c?'disabled':''} onclick="tup('${k}')">🪙${c}</button></div>`}).join('');
const g=Math.floor(S.stage/10);
document.getElementById('pr').innerHTML=`<div class="row"><span class="e">🔁</span><div class="t"><b>転生</b> ⭐${S.star}<br><small>${S.stage<10?'ステージ10で解放':'リセットして⭐+'+g+'（⭐1個ごとに全体+10%）'+(opts().length&&keep==null?' ※下で引き継を1体を選んでね':'')}</small></div><button class="pr" ${S.stage<10||(opts().length&&keep==null)?'disabled':''} onclick="rb()">${arm?'もう一度タップ!':'転生'}</button></div>`+(S.stage>=10&&opts().length?`<div class="row"><div class="t"><b>引き継を1体</b> <small>(ハムは固定で、レベルもそのまま)</small><br>${opts().map(i=>`<button style="margin:4px 4px 0 0;${keep==i?'background:var(--mint)':''}" onclick="pick(${i})">${H[i].e} Lv${S.own[i]}</button>`).join('')}</div></div>`:'')}
function tup(k){const c=tc(k);if(S.gold<c)return;S.gold-=c;const o=P.map(p=>mhp(p.i));S.tr[k]++;P.forEach((p,j)=>{if(p.hp>0)p.hp+=mhp(p.i)-o[j]});list();save()}
function rb(){if(!arm){arm=1;tree();setTimeout(()=>{arm=0;tree()},3000);return}
S.star+=Math.floor(S.stage/10);const k=keep,kl=k!=null?S.own[k]:0;S.stage=1;S.gold=0;S.own={0:1};S.slots=[0,null,null,null,null];if(k!=null){S.own[k]=kl;S.slots[1]=k}keep=null;S.sm=0;S.tr={i:0,a:0,h:0,g:0};arm=0;P=[];for(const z in stash)delete stash[z];party();spawn();slots();list();save()}
function autoEq(i){const lim=5+S.ul,z=H[i].sz||1;
if(z==1){const e=S.slots.slice(0,lim).indexOf(null);if(e<0)return false;S.slots[e]=i;return true}
for(const s of [0,1,4]){if(s+2<lim&&S.slots[s]==null&&S.slots[s+1]==null&&S.slots[s+2]==null){S.slots[s]=i;S.slots[s+1]=-1;S.slots[s+2]=-1;return true}}return false}
function place(s){const sz=i=>H[i].sz||1,cur=S.slots[s];if(cur==-1)return;
const used=S.slots.filter((x,k)=>k!=s&&x!=null&&x>=0),opts=Object.keys(S.own).map(Number).filter(i=>!used.includes(i));
let k=cur==null?0:opts.indexOf(cur)+1;
if(cur!=null&&sz(cur)==3){S.slots[s+1]=null;S.slots[s+2]=null}
const lim=5+S.ul,fit=i=>sz(i)==1||([0,1,4].includes(s)&&s+2<lim&&S.slots[s+1]==null&&S.slots[s+2]==null);
let c=null;for(;k<opts.length;k++){if(fit(opts[k])){c=opts[k];break}}
S.slots[s]=c;if(c!=null&&sz(c)==3){S.slots[s+1]=-1;S.slots[s+2]=-1}
party();slots();bag();save()}
function equip(i){const s=S.slots.indexOf(i);
if(s>=0){S.slots[s]=null;if((H[i].sz||1)==3){S.slots[s+1]=null;S.slots[s+2]=null}}
else if(!autoEq(i)){document.getElementById('gm').textContent=(H[i].sz||1)==3?'連続した3つの空き枠が必要です(上段の1〜3か2〜4、または5〜7)':'スロットが満員！先に外してね';return}
party();slots();bag();save()}
party();spawn();list();slots();
setInterval(()=>{tick();if(++n%10==0){list();save()}},100);
</script></body></html>
